<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>39ers Delights — Cashier Device Reset</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f5f5f5;color:#222;margin:0;padding:24px;display:grid;min-height:100vh;place-items:center;box-sizing:border-box}
    main{background:#fff;max-width:520px;width:100%;padding:28px;border-radius:14px;box-shadow:0 3px 18px #0001;box-sizing:border-box}
    h1{font-size:24px;margin-top:0} p{line-height:1.5} label{display:block;font-weight:bold;margin:18px 0 8px}
    input{width:100%;padding:13px;font-size:16px;box-sizing:border-box;border:1px solid #aaa;border-radius:8px}
    button{margin-top:16px;width:100%;padding:14px;font-size:16px;font-weight:bold;background:#1769aa;color:white;border:0;border-radius:8px;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}.note{font-size:14px;color:#555}.result{margin-top:18px;padding:12px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}.ok{background:#e8f5e9;color:#14532d}.bad{background:#ffebee;color:#991b1b}
  </style>
</head>
<body>
<main>
  <h1>39ers Delights — Cashier Device Reset</h1>
  <p>This page resets only the saved cashier-device authorization. It does <strong>not</strong> delete your menu, mobile orders, POS sales, inventory, or Google Sheets records.</p>
  <p class="note">Use this only when instructed. Keep the reset code private.</p>
  <form id="resetForm">
    <label for="token">One-time reset code</label>
    <input id="token" type="password" autocomplete="off" required minlength="24" placeholder="Enter the reset code from your setup">
    <button id="submitButton" type="submit">Reset cashier authorization</button>
  </form>
  <div id="result" role="status" aria-live="polite"></div>
</main>
<script>
const form=document.getElementById('resetForm');
const button=document.getElementById('submitButton');
const result=document.getElementById('result');
form.addEventListener('submit',async event=>{
  event.preventDefault(); result.className='result'; result.textContent='Please wait…'; button.disabled=true;
  try{
    const response=await fetch('/api/reset-pos-device',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:document.getElementById('token').value})});
    const data=await response.json().catch(()=>({}));
    if(!response.ok||!data.ok) throw new Error(data.message||`Request failed (${response.status})`);
    result.className='result ok'; result.textContent=data.message;
    form.reset();
  }catch(error){result.className='result bad';result.textContent=error.message;}
  finally{button.disabled=false;}
});
</script>
</body>
</html>
